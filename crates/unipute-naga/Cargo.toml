[package]
name = "unipute-naga"
description = "Naga IR backend for Unipute: lowers Unipute IR to naga and writes WGSL, SPIR-V, MSL, HLSL and GLSL"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
unipute-ir = { workspace = true }
naga = { workspace = true }

[features]
default = ["wgsl"]
wgsl = ["naga/wgsl-out"]
spv = ["naga/spv-out"]
msl = ["naga/msl-out"]
hlsl = ["naga/hlsl-out"]
glsl = ["naga/glsl-out"]
