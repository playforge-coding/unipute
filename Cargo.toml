[package]
name = "unipute"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A compile time generating, language and graphics API agnostic GPU library"
repository = "https://github.com/playforge-coding/unipute"
readme = "README.md"
keywords = ["gpu", "shader", "compute", "naga", "wgsl"]
categories = ["graphics", "rendering"]

[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/playforge-coding/unipute"

[workspace.dependencies]
naga = "30.0.1"
proc-macro2 = "1.0.107"
quote = "1.0.42"
syn = "3.0.6"
unipute-ir = { version = "0.1.0", path = "crates/unipute-ir" }
unipute-macros = { version = "0.1.0", path = "crates/unipute-macros" }
# Targets are opted into by feature, so members never inherit the default one.
unipute-naga = { version = "0.1.0", path = "crates/unipute-naga", default-features = false }

[features]
default = ["wgsl"]

# Backend target languages. Each one enables the matching naga writer and the
# matching compile time target inside the `kernel` macro.
#
# The macro runs on the host while the runtime back end is built for the
# target, so cargo keeps their features apart and each one has to be named.
# The `?` form only applies when `runtime` has pulled the back end in.
wgsl = ["unipute-macros/wgsl", "unipute-naga?/wgsl"]
spv = ["unipute-macros/spv", "unipute-naga?/spv"]
msl = ["unipute-macros/msl", "unipute-naga?/msl"]
hlsl = ["unipute-macros/hlsl", "unipute-naga?/hlsl"]
glsl = ["unipute-macros/glsl", "unipute-naga?/glsl"]

# Translate kernels at run time instead of (or in addition to) compile time.
runtime = ["dep:unipute-naga"]

[dependencies]
unipute-ir = { workspace = true }
unipute-macros = { workspace = true }
unipute-naga = { workspace = true, optional = true }

# The examples and the GPU tests run kernels through wgpu. It is a dev
# dependency only: the library itself still brings no graphics API with it.
#
# wgpu is pinned to the same major version as naga, since the `naga-ir` input
# hands it a module built by unipute-naga, and the two have to be the same
# naga for the types to match. `spirv` and `glsl` let the tests feed wgpu the
# other targets this crate generates, so each writer is exercised on a GPU
# rather than only through the validator.
[dev-dependencies]
pollster = "1.0.1"
trybuild = "1.0.121"
wgpu = { version = "30.0.1", default-features = false, features = [
    "std",
    "parking_lot",
    "dx12",
    "metal",
    "gles",
    "vulkan",
    "wgsl",
    "spirv",
    "glsl",
    "naga-ir",
] }
zerocopy = { version = "0.8.57", features = ["derive"] }

# Examples that read the WGSL constant, whether to print it or to run it, so
# cargo should leave them out of a build that does not have that writer rather
# than failing to compile them. `inspect_ir` is not listed, since it only
# reads the IR and needs no writer.
[[example]]
name = "emit_shaders"
required-features = ["wgsl"]

[[example]]
name = "image_blur"
required-features = ["wgsl"]

[[example]]
name = "prefix_sum"
required-features = ["wgsl"]

[[example]]
name = "nbody"
required-features = ["wgsl"]

# This one translates while it runs, which is what the `runtime` feature is.
[[example]]
name = "retarget"
required-features = ["runtime"]

# The cranelift dev backend lives in .cargo/config.toml, not here. Putting it
# in the manifest would make this crate unparseable on stable cargo, including
# for anyone depending on it.
