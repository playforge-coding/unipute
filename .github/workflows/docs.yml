name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let a running deployment finish rather than cancelling it part way, since a
# half deployed site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.5.4"
  # .cargo/config.toml sets sccache as the rustc wrapper, so the job that runs
  # cargo from inside the checkout has to have it on PATH. This points it at
  # the Actions cache for its storage.
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    name: Build the guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The toolchain and its components come from rust-toolchain.toml, which
      # pins nightly for the cranelift dev backend.
      - name: Install Rust
        run: rustup show

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2

      # Every Rust example in the guide is a doctest of the `unipute` crate,
      # so this is what stops the book drifting away from the code. A guide
      # with examples that no longer compile should not be published.
      - name: Check the guide's examples
        run: cargo test --doc --features "runtime,spv,msl,hlsl,glsl"

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSLf \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the book
        run: mdbook build docs

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

  deploy:
    name: Deploy to GitHub Pages
    # Pull requests build the book to check it still works, but only main
    # publishes.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
